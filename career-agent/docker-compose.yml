# Personal AI Career Agent: n8n + PostgreSQL on one small machine.
#   cp .env.example .env   # fill it in
#   docker compose up -d
#   scripts/bootstrap.sh   # credentials + workflows
# n8n listens on 127.0.0.1 only; reach it over an SSH tunnel (ssh -L 5678:localhost:5678 vps).
services:
  postgres:
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: n8n
      CAREER_DB_PASSWORD: ${CAREER_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
      - ./db:/career-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d n8n"]
      interval: 10s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.7   # pinned: workflows use node versions from this release
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_ADMIN_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}       # encrypts stored credentials: back it up
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"            # workflows read config from the settings table, not env
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"                  # keep 14 days of execution history
      N8N_HOST: ${N8N_HOST:-localhost}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

volumes:
  pgdata:
  n8ndata:
