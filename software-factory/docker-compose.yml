services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-factory}
      POSTGRES_USER: ${POSTGRES_USER:-factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-factory}
      DATABASE_USERNAME: ${POSTGRES_USER:-factory}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    # Real mode (FACTORY_INTEGRATIONS=real) runs sandboxes through the host's Docker. Uncomment both lines.
    # WARNING: access to the Docker socket is root-equivalent on the host. Run this only on a machine dedicated
    # to the factory.
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock
    #   - factory-work:/var/lib/factory

volumes:
  pgdata:
  factory-work:
