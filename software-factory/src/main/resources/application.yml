spring:
  application:
    name: software-factory
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/factory}
    username: ${DATABASE_USERNAME:factory}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  # Metrics and health on their own port, which docker-compose does not publish: Prometheus scrapes it from inside
  # the network, without dashboard sign-in. Set MANAGEMENT_PORT to the server port to put them on the main port
  # (then they need sign-in like everything else, except health).
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  pattern:
    # Ticket and job ids on every line written while a job runs (empty otherwise).
    level: "%5p [t:%X{ticketId:-} j:%X{jobId:-}]"

factory:
  # fake (default) | real
  integrations: ${FACTORY_INTEGRATIONS:fake}
  webhook:
    # Shared secret of the GitHub webhook (content type application/json; events: issues, pull_request,
    # pull_request_review). Empty: no webhook endpoint, polling only.
    secret: ${GITHUB_WEBHOOK_SECRET:}
  security:
    # github | basic | none (fake mode only). Empty: none in fake mode; real mode then refuses to start.
    mode: ${FACTORY_SECURITY:}
    allowed-users: ${FACTORY_ALLOWED_USERS:}
    github-client-id: ${GITHUB_OAUTH_CLIENT_ID:}
    github-client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
    admin-user: ${FACTORY_ADMIN_USER:admin}
    admin-password: ${FACTORY_ADMIN_PASSWORD:}
  # Target repository and the issue label that opts an issue into the factory.
  repo: ${FACTORY_REPO:example-org/example-repo}
  trigger-label: ${FACTORY_TRIGGER_LABEL:factory}
  base-branch: ${FACTORY_BASE_BRANCH:main}
  worker:
    enabled: ${FACTORY_WORKER_ENABLED:true}
    threads: ${FACTORY_WORKER_THREADS:2}
    poll-interval: ${FACTORY_WORKER_POLL_INTERVAL:PT1S}
    lease-timeout: PT10M
    retry-backoff: PT2S
    # How often a ticket waiting for approval asks GitHub; webhooks (below) make it react at once anyway.
    approval-poll-interval: ${FACTORY_APPROVAL_POLL_INTERVAL:PT1M}
  poller:
    enabled: ${FACTORY_POLLER_ENABLED:true}
    interval: ${FACTORY_POLLER_INTERVAL:PT10S}
  guardrails:
    max-cost-usd: ${FACTORY_MAX_COST_USD:2.00}
    max-turns: ${FACTORY_MAX_TURNS:40}
    hard-timeout: ${FACTORY_HARD_TIMEOUT:PT30M}
    max-retries: ${FACTORY_MAX_RETRIES:3}
  # Real GitHub client (factory.integrations=real). Use a GitHub App (recommended) or a token. Secrets: env only.
  github:
    api-url: ${GITHUB_API_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
    app-id: ${GITHUB_APP_ID:}
    app-installation-id: ${GITHUB_APP_INSTALLATION_ID:}
    app-private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:}
    min-labeler-permission: ${FACTORY_MIN_LABELER_PERMISSION:write}
  # Docker sandbox (factory.integrations=real). Needs the Docker socket; see README.
  sandbox:
    image: ${FACTORY_SANDBOX_IMAGE:factory-sandbox:latest}
    memory: ${FACTORY_SANDBOX_MEMORY:4g}
    cpus: ${FACTORY_SANDBOX_CPUS:2.0}
    host-work-dir: ${FACTORY_WORK_DIR:/var/lib/factory}
    clone-url-template: ${FACTORY_CLONE_URL_TEMPLATE:https://github.com/{repo}.git}
  agent:
    # Exactly one is needed in real mode. It stays on this host and in the model proxy, never in a sandbox.
    api-key: ${ANTHROPIC_API_KEY:}
    oauth-token: ${CLAUDE_CODE_OAUTH_TOKEN:}
    model: ${FACTORY_AGENT_MODEL:}
    tools: ${FACTORY_AGENT_TOOLS:Bash,Read,Edit,Write}
    upstream-url: ${FACTORY_AGENT_UPSTREAM_URL:https://api.anthropic.com}
  checks:
    # Each target repo names its check command in .factory.yml on the base branch (see README). These are fallbacks.
    default-command: ${FACTORY_CHECKS_DEFAULT_COMMAND:}
    default-timeout: ${FACTORY_CHECKS_DEFAULT_TIMEOUT:PT10M}
    max-timeout: ${FACTORY_CHECKS_MAX_TIMEOUT:PT30M}
  fakes:
    # Default behaviour of each fake: succeed | fail | fail-then-succeed
    sandbox: { mode: succeed, failures-before-success: 1 }
    agent: { mode: succeed, failures-before-success: 1, turns-per-run: 6, input-tokens-per-turn: 4000, output-tokens-per-turn: 800, cost-per-run-usd: 0.12, delay: PT0S }
    checks: { mode: succeed, failures-before-success: 1 }
    github: { mode: succeed, failures-before-success: 1, auto-approve: true }
