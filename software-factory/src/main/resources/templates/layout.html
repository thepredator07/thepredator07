<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · Software Factory'">Software Factory</title>
  <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<header th:fragment="nav(active)">
  <div class="bar-top">
    <a class="brand" th:href="@{/tickets}">Software Factory</a>
    <nav>
      <a th:href="@{/tickets}" th:classappend="${active == 'tickets'} ? 'active'">Tickets</a>
      <a th:href="@{/stats}" th:classappend="${active == 'stats'} ? 'active'">Stats</a>
    </nav>
    <span class="tag"><span th:text="${props.fakeMode()} ? 'Fake mode · fake sandbox, agent &amp; GitHub' : 'Real mode'">mode</span>
      · <span th:text="${props.repo}">repo</span></span>
    <form th:if="${currentUser != null}" class="signout" method="post" th:action="@{/logout}">
      <span th:text="${currentUser}">user</span> <button type="submit">Sign out</button>
    </form>
  </div>
</header>
</body>
</html>
